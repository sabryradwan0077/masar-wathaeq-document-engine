services:
  - type: web
    name: masar-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: AI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: BILLING_ADMIN_EMAIL
        sync: false
      - key: BILLING_ADMIN_KEY
        sync: false
      - key: MONTHLY_PRICE_EGP
        value: 200
      - key: VODAFONE_CASH_NUMBER
        value: "+201015707603"
